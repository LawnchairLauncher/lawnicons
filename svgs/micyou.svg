<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- MicYou icon for Lawnicons -->
  <!-- Design specs: 12px stroke, round caps/joins, #000000 color -->
  <!-- Content area: 148x148px centered (22px padding) -->
  
  <!-- Microphone head - rounded rectangle -->
  <rect x="72" y="22" width="48" height="100" rx="24" ry="24" 
        fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Microphone arc - bottom curve -->
  <path d="M144 86V98C144 124.509 122.509 146 96 146C69.491 146 48 124.509 48 98V86" 
        fill="none" stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Microphone stand - vertical line -->
  <line x1="96" y1="146" x2="96" y2="170" 
        stroke="#000000" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>