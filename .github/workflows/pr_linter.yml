name: Icon Linter

on:
  pull_request_target:
    branches: [ develop ]
    types: [ opened, synchronize, reopened ]
    paths:
      - svgs/*

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base code
        uses: actions/checkout@v7
        with:
          path: trusted

      - name: Checkout PR merge snapshot
        # Fetch full history of the main repository, then checkout the
        # PR merge commit for diffing against the base branch.
        uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 0 # Needed to compare with base branch
          allow-unsafe-pr-checkout: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: pip install -r trusted/.github/scripts/requirements.txt

      - name: Run Linter and Post Comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python trusted/.github/scripts/bot_orchestrator.py --data-repo-dir pr
