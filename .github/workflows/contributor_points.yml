name: Contributor Points

on:
  push:
    branches: [ develop ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to credit (leave empty to mark fulfilled requests)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributor-points
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.event.repository.fork == false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Prepare PR description
        env:
          SUMMARY_FILE: ${{ runner.temp }}/contributor-points-body.md
        run: |
          cat > "$SUMMARY_FILE" <<'EOF'
          ## Contributor points update

          No point totals changed in this run.

          _Auto-generated by the Contributor Points workflow._
          EOF

      - name: Credit merged PR from push
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          SUMMARY_FILE: ${{ runner.temp }}/contributor-points-body.md
        run: python3 .github/scripts/sync_contributor_points.py --repo "$GITHUB_REPOSITORY" --commit "$COMMIT_SHA" --summary-file "$SUMMARY_FILE"

      - name: Credit PR manually
        if: github.event_name == 'workflow_dispatch' && inputs.pr_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          SUMMARY_FILE: ${{ runner.temp }}/contributor-points-body.md
        run: python3 .github/scripts/sync_contributor_points.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --summary-file "$SUMMARY_FILE"

      - name: Mark fulfilled requests
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')
        env:
          SUMMARY_FILE: ${{ runner.temp }}/contributor-points-body.md
        run: python3 .github/scripts/sync_contributor_points.py --mark-fulfilled --summary-file "$SUMMARY_FILE"

      - name: Validate
        run: python3 .github/scripts/sync_contributor_points.py --check

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update contributor points
          title: Update contributor points
          body-path: ${{ runner.temp }}/contributor-points-body.md
          branch: actions/contributor-points
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      - name: Enable auto-merge
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
