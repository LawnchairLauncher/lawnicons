name: Contributor Points

on:
  pull_request_target:
    branches: [ develop ]
    types: [ closed ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to credit (leave empty to mark fulfilled requests)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: contributor-points
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    if: >-
      github.event.repository.fork == false &&
      (github.event.pull_request.merged == true ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Credit merged PR
        if: >-
          github.event_name != 'schedule' &&
          (github.event.pull_request.merged == true || inputs.pr_number != '')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: python3 scripts/sync_contributor_points.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER"

      - name: Mark fulfilled requests
        if: >-
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.pr_number == '')
        run: python3 scripts/sync_contributor_points.py --mark-fulfilled

      - name: Validate
        run: python3 scripts/sync_contributor_points.py --check

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: Update contributor points
          title: Update contributor points
          body: _Auto-generated by the Contributor Points workflow._
          branch: actions/contributor-points
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>

      - name: Enable auto-merge
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --auto --squash
