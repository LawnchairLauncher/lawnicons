name: General discussion
description: Discuss something related to Lawnicons.
body:
  - type: textarea
    id: question
    attributes:
      label: Description
      description: |
        > [!NOTE]
        > 1. Please attach screenshots or screen recordings so that we can understand your issue better.  
        > 2. If you want to report a bug, it may have been fixed in [the pre-release build](https://github.com/LawnchairLauncher/lawnicons#download).  
        > 3. This isn't the place for icon requests.
        
    validations:
      required: true
